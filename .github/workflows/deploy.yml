name: Deploy to GitHub Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - name: Verify deploy secrets
        run: |
          for name in BLIZZARD_CLIENT_ID BLIZZARD_CLIENT_SECRET BLIZZARD_REGION ALLIANCE_MAGE_REALM ALLIANCE_MAGE_NAME HORDE_MAGE_REALM HORDE_MAGE_NAME; do
            if [ -z "${!name}" ]; then
              echo "::warning::$name is not set — armory pages will be skipped"
            fi
          done
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          BLIZZARD_REGION: ${{ secrets.BLIZZARD_REGION }}
          ALLIANCE_MAGE_REALM: ${{ secrets.ALLIANCE_MAGE_REALM }}
          ALLIANCE_MAGE_NAME: ${{ secrets.ALLIANCE_MAGE_NAME }}
          HORDE_MAGE_REALM: ${{ secrets.HORDE_MAGE_REALM }}
          HORDE_MAGE_NAME: ${{ secrets.HORDE_MAGE_NAME }}

      - run: pnpm run build
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          BLIZZARD_REGION: ${{ secrets.BLIZZARD_REGION }}
          ALLIANCE_MAGE_REALM: ${{ secrets.ALLIANCE_MAGE_REALM }}
          ALLIANCE_MAGE_NAME: ${{ secrets.ALLIANCE_MAGE_NAME }}
          HORDE_MAGE_REALM: ${{ secrets.HORDE_MAGE_REALM }}
          HORDE_MAGE_NAME: ${{ secrets.HORDE_MAGE_NAME }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
